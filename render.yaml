services:
  - type: web
    name: cbe-timetable
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: cbe-timetable-db
          property: connectionString

databases:
  - name: cbe-timetable-db
    databaseName: timetable
    user: timetable_user
